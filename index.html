<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="baobao: free, offline Chinese (Mandarin) lessons with XP, streaks, hearts and leagues.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="baobao">
<title>baobao: Learn Chinese</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: inherit; }
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --font-ui: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-zh: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;

  --bg: #ffffff;
  --surface: #f3f6f7;
  --card: #ffffff;
  --line: #e2e8eb;
  --line-strong: #cbd5da;
  --ink: #22313a;
  --ink-soft: #66777f;
  --ink-faint: #a5b2b9;
  --scrim: rgba(12, 22, 28, .55);

  --jade: #14a86d; --jade-deep: #0c8253; --jade-tint: #dbf5e9;
  --porcelain: #2f7fe0; --porcelain-deep: #1d5fb3; --porcelain-tint: #e2eeff;
  --lantern: #e5382d; --lantern-deep: #b4231a; --lantern-tint: #ffe4e1;
  --gold: #f5b300; --gold-deep: #c98a00; --gold-tint: #fff3c7;
  --plum: #9259e0; --plum-deep: #6e3ab8; --plum-tint: #f0e6ff;
  --teal: #0fa39d; --teal-deep: #0a7a75; --teal-tint: #d8f5f3;
  --ember: #ff8a00; --ember-deep: #d46e00;
  --wrong: #e9443d; --wrong-deep: #b82d27; --wrong-tint: #ffe1df;
  --grid: rgba(229, 56, 45, .32);
  --amber: #e07800; --amber-deep: #a85a00; --amber-tint: #ffecd4;
  --jade-ink: #0b7a4c; --porcelain-ink: #1b58a8; --lantern-ink: #b0231a; --gold-ink: #946500;
  --plum-ink: #6634ad; --teal-ink: #08716c; --wrong-ink: #b02a24; --amber-ink: #9a5200;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0f1b20; --surface: #172630; --card: #15232b; --line: #263842; --line-strong: #364c57;
  --ink: #edf3f5; --ink-soft: #9db1ba; --ink-faint: #5d7480; --scrim: rgba(0, 0, 0, .62);
  --jade: #1bb877; --jade-deep: #0d7a4d; --jade-tint: #0f3527;
  --porcelain: #4a92ec; --porcelain-deep: #23589f; --porcelain-tint: #132b4a;
  --lantern: #ec4b40; --lantern-deep: #a0241b; --lantern-tint: #3a1714;
  --gold: #f5b300; --gold-deep: #a87700; --gold-tint: #382c08;
  --plum: #9a63e6; --plum-deep: #5f33a3; --plum-tint: #2a1d45;
  --teal: #13aaa3; --teal-deep: #087570; --teal-tint: #0c3533;
  --amber: #e8820a; --amber-deep: #8f4d00; --amber-tint: #3a2408;
  --ember: #ff9419; --ember-deep: #b85c00;
  --wrong: #ef5048; --wrong-deep: #a32a24; --wrong-tint: #3d1715;
  --jade-ink: #5fe0a8; --porcelain-ink: #8cc0ff; --lantern-ink: #ff8f85; --gold-ink: #ffd24d;
  --plum-ink: #c9a6ff; --teal-ink: #5fdcd5; --wrong-ink: #ff9089; --amber-ink: #ffb35c;
  --grid: rgba(255, 115, 105, .34);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1b20; --surface: #172630; --card: #15232b; --line: #263842; --line-strong: #364c57;
  --ink: #edf3f5; --ink-soft: #9db1ba; --ink-faint: #5d7480; --scrim: rgba(0, 0, 0, .62);
  --jade: #1bb877; --jade-deep: #0d7a4d; --jade-tint: #0f3527;
  --porcelain: #4a92ec; --porcelain-deep: #23589f; --porcelain-tint: #132b4a;
  --lantern: #ec4b40; --lantern-deep: #a0241b; --lantern-tint: #3a1714;
  --gold: #f5b300; --gold-deep: #a87700; --gold-tint: #382c08;
  --plum: #9a63e6; --plum-deep: #5f33a3; --plum-tint: #2a1d45;
  --teal: #13aaa3; --teal-deep: #087570; --teal-tint: #0c3533;
  --amber: #e8820a; --amber-deep: #8f4d00; --amber-tint: #3a2408;
  --ember: #ff9419; --ember-deep: #b85c00;
  --wrong: #ef5048; --wrong-deep: #a32a24; --wrong-tint: #3d1715;
  --jade-ink: #5fe0a8; --porcelain-ink: #8cc0ff; --lantern-ink: #ff8f85; --gold-ink: #ffd24d;
  --plum-ink: #c9a6ff; --teal-ink: #5fdcd5; --wrong-ink: #ff9089; --amber-ink: #ffb35c;
  --grid: rgba(255, 115, 105, .34);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 17px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
html.locked, html.locked body { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; border: 0; background: none; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--porcelain); outline-offset: 2px; border-radius: 8px; }
.zh { font-family: var(--font-zh); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 1.25em; height: 1.25em; flex: none; display: inline-block; vertical-align: middle; }
.muted { color: var(--ink-soft); }

/* ---------- Buttons ---------- */
.btn {
  --b: var(--jade); --bd: var(--jade-deep);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 10px 22px; border-radius: 16px;
  background: var(--b); color: #fff; font-weight: 800; font-size: 1.05rem; letter-spacing: .01em;
  box-shadow: 0 4px 0 var(--bd); transition: transform .07s, box-shadow .07s, filter .15s;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--bd); }
.btn:disabled { background: var(--line); color: var(--ink-faint); box-shadow: 0 4px 0 var(--line-strong); cursor: default; }
.btn.block { width: 100%; }
.btn.blue { --b: var(--porcelain); --bd: var(--porcelain-deep); }
.btn.red { --b: var(--wrong); --bd: var(--wrong-deep); }
.btn.gold { --b: var(--gold); --bd: var(--gold-deep); color: #3a2800; }
.btn.ghost { background: var(--card); color: var(--porcelain); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.btn.ghost:active { box-shadow: 0 0 0 var(--line); }
.btn.white { background: #fff; color: var(--u, var(--jade)); box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.btn.small { white-space: nowrap; min-height: 40px; padding: 6px 14px; font-size: .95rem; border-radius: 12px; }
.link-btn { color: var(--porcelain); font-weight: 800; padding: 10px; border-radius: 10px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-faint); flex: none; }
.icon-btn:active { background: var(--surface); }
.icon-btn svg { width: 24px; height: 24px; }

/* ---------- Shell ---------- */
.side, .rail { display: none; }
.main-col { max-width: 640px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 2px solid var(--line);
  display: flex; justify-content: space-around;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 56px; padding: 6px 8px; border-radius: 14px; border: 2px solid transparent;
  color: var(--ink-soft); font-weight: 700; font-size: .72rem;
}
.nav-item svg { width: 28px; height: 28px; }
.nav-item.on { color: var(--porcelain); background: var(--porcelain-tint); border-color: color-mix(in srgb, var(--porcelain) 45%, transparent); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.6rem; color: var(--jade); letter-spacing: -.01em; }
.seal {
  display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px;
  background: var(--lantern); color: #fff; font-size: 1.35rem; transform: rotate(-6deg);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.35);
}
@media (min-width: 760px) {
  .tabbar { display: none; }
  .side {
    display: flex; flex-direction: column; gap: 6px;
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 20; width: 92px;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 18px;
    border-right: 2px solid var(--line); background: var(--bg);
  }
  .side .logo { justify-content: center; margin-bottom: 18px; }
  .side .logo-word { display: none; }
  .side .nav-item { flex-direction: row; justify-content: center; font-size: 1rem; padding: 10px; }
  .side .nav-label { display: none; }
  .shell { padding-left: 92px; }
  .main-col { padding-bottom: 56px; }
}
@media (min-width: 1100px) {
  .side { width: 248px; padding-inline: 18px; }
  .side .logo { justify-content: flex-start; padding-left: 10px; }
  .side .logo-word { display: inline; }
  .side .nav-item { justify-content: flex-start; gap: 16px; padding: 10px 14px; letter-spacing: .02em; }
  .side .nav-label { display: inline; }
  .shell { padding-left: 248px; display: flex; justify-content: center; gap: 44px; }
  .main-col { margin: 0; flex: 0 1 600px; min-width: 0; }
  .rail { display: flex; flex-direction: column; gap: 18px; width: 340px; flex: none; position: sticky; top: env(safe-area-inset-top, 0px); align-self: flex-start; padding: 16px 0 40px; }
  .wide-hide { display: none !important; }
}

/* ---------- HUD (score bar) ---------- */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  height: 64px; margin: 0 -16px; padding: 0 12px 0 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  background: var(--bg); border-bottom: 2px solid var(--line);
  box-shadow: 0 calc(-1 * env(safe-area-inset-top, 0px)) 0 var(--bg);
}
@media (min-width: 760px) { .hud { margin: 0; padding: 0 4px; } }
.hud-score { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 0; border-radius: 14px; min-width: 0; }
.lvl-ring {
  --p: 0; width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--p) * 1turn), var(--line) 0);
}
.lvl-ring b { width: 34px; height: 34px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 1rem; color: var(--gold-ink); line-height: 1; }
.score-txt { display: flex; flex-direction: column; line-height: 1.05; text-align: left; min-width: 0; }
.score-num { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.score-num .ico { width: 22px; height: 22px; }
.score-sub { font-size: .74rem; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.hud-stats { display: flex; gap: 2px; }
.stat { display: flex; align-items: center; gap: 4px; padding: 8px 7px; border-radius: 12px; font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.stat .ico { width: 24px; height: 24px; }
.stat:active, .hud-score:active { background: var(--surface); }
.stat.streak b { color: var(--ember); }
.stat.streak.cold b { color: var(--ink-faint); }
.stat.streak.cold .ico path { fill: var(--ink-faint); }
.stat.gems b { color: var(--teal); }
.stat.hearts b { color: var(--lantern); }
.boost-badge { font-size: .7rem; font-weight: 800; background: var(--plum); color: #fff; border-radius: 6px; padding: 1px 5px; margin-left: 2px; }
.bump { animation: bump .45s ease-out; }
@keyframes bump { 30% { transform: scale(1.22); } 100% { transform: scale(1); } }

/* ---------- Cards & common ---------- */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; }
.card h3 { font-size: 1.15rem; font-weight: 800; }
.page-head { padding: 22px 0 14px; }
.page-head h1 { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
.page-head p { color: var(--ink-soft); margin-top: 4px; font-weight: 600; }
.bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--gold); position: relative; }
.bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.4); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; background: var(--surface); font-weight: 700; font-size: .85rem; }

/* goal card */
.goal { display: flex; align-items: center; gap: 14px; }
.ring { --p: 0; --c: var(--gold); width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1turn), var(--line) 0); }
.ring > span { width: 50px; height: 50px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.4rem; }
.goal-txt { flex: 1; min-width: 0; }
.goal-txt b { font-size: 1.05rem; }
.goal-txt p { color: var(--ink-soft); font-weight: 600; font-size: .92rem; }
.goal-strip { margin: 14px 0 0; padding: 12px 14px; }
.goal-strip .ring { width: 52px; height: 52px; }
.goal-strip .ring > span { width: 40px; height: 40px; font-size: 1.15rem; }

/* ---------- Learning path ---------- */
.unit { position: relative; margin-top: 18px; }
.unit-banner {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); z-index: 6;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 14px 14px 18px; border-radius: 18px;
  background: var(--u); color: #fff; box-shadow: 0 4px 0 var(--ud);
}
.unit-banner .u-num { font-weight: 700; opacity: .85; font-size: .9rem; }
.unit-banner h2 { font-size: 1.3rem; font-weight: 800; line-height: 1.15; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.unit-banner h2 .zh { font-size: 1.1rem; opacity: .9; font-weight: 700; }
.unit-banner p { font-size: .9rem; font-weight: 600; opacity: .9; }
.guide-btn {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 14px;
  border: 2px solid rgba(255,255,255,.35); color: #fff; font-weight: 800; font-size: .9rem;
}
.guide-btn svg { width: 22px; height: 22px; }
.guide-btn:active { background: rgba(0,0,0,.12); }
@media (max-width: 400px) { .guide-btn span { display: none; } }

.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 62px 0 30px; }
.node-wrap { position: relative; transform: translateX(var(--x, 0)); }
.node {
  position: relative; width: 74px; height: 68px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--u); color: #fff; box-shadow: 0 7px 0 var(--ud);
  font-family: var(--font-zh); font-weight: 700; font-size: 31px; line-height: 1;
  transition: transform .07s, box-shadow .07s;
}
.node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--ud); }
.node svg { width: 42px; height: 42px; }
.node.locked { background: var(--line); color: var(--ink-faint); box-shadow: 0 7px 0 var(--line-strong); }
.node.locked:active { box-shadow: 0 1px 0 var(--line-strong); }
.node .lock { position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); display: grid; place-items: center; color: var(--ink-faint); }
.node .lock svg { width: 14px; height: 14px; }
.node.done::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  border: 3px solid var(--gold); opacity: 0; pointer-events: none;
}
.node.gold::after { opacity: 1; }
.node-wrap.current::before {
  content: ""; position: absolute; left: -11px; right: -11px; top: -11px; bottom: -17px; border-radius: 50%;
  border: 6px solid color-mix(in srgb, var(--u) 28%, transparent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(1.06); opacity: .6; } }
.start-bubble {
  position: absolute; bottom: calc(100% + 18px); left: 50%; transform: translateX(-50%);
  padding: 6px 14px; border-radius: 12px; white-space: nowrap; pointer-events: none;
  background: var(--card); color: var(--u); border: 2px solid var(--line); font-weight: 800; font-size: 1rem;
  animation: bob 1.5s ease-in-out infinite;
}
.start-bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top-color: var(--line); }
@keyframes bob { 50% { transform: translate(-50%, -6px); } }
.node-stars { position: absolute; top: calc(100% + 11px); left: 50%; transform: translateX(-50%); display: flex; gap: 1px; }
.node-stars svg { width: 15px; height: 15px; }
.node-pop {
  position: absolute; top: calc(100% + 22px); left: 50%; z-index: 9;
  width: min(320px, calc(100vw - 32px)); transform: translateX(calc(-50% - var(--x, 0px)));
  padding: 16px; border-radius: 18px; background: var(--u); color: #fff; box-shadow: 0 4px 0 var(--ud);
  animation: popIn .16s ease-out;
}
.node-pop::before { content: ""; position: absolute; bottom: 100%; left: calc(50% + var(--x, 0px)); margin-left: -10px; border: 10px solid transparent; border-bottom-color: var(--u); }
.node-pop.locked { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.node-pop.locked::before { border-bottom-color: var(--line); }
.node-pop h3 { font-size: 1.2rem; font-weight: 800; }
.node-pop p { font-weight: 600; opacity: .92; margin: 2px 0 12px; }
.pop-words { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
.pop-words span { background: rgba(255,255,255,.2); border-radius: 8px; padding: 2px 9px; font-size: 1.05rem; }
@keyframes popIn { from { opacity: 0; transform: translateX(calc(-50% - var(--x, 0px))) translateY(-6px); } }
.path-mascot { position: absolute; top: 228px; width: 104px; pointer-events: none; }
.path-mascot.r { left: calc(50% + 44px); }
.path-mascot.l { right: calc(50% + 44px); }
.path-end { text-align: center; padding: 24px 0 8px; color: var(--ink-soft); font-weight: 700; }

/* ---------- Panda ---------- */
.panda { display: block; width: 100%; height: auto; }
.panda.wave { animation: wave 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-6deg); } 80% { transform: rotate(5deg); } 90% { transform: rotate(-3deg); } }

/* ---------- Practice / words / league / profile ---------- */
.tiles { display: grid; gap: 14px; }
@media (min-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
  padding: 18px; border-radius: 20px; border: 2px solid var(--line); border-bottom-width: 5px; background: var(--card);
  transition: transform .07s;
}
.tile-card:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; margin-top: 3px; }
.tile-card:disabled { opacity: .55; cursor: default; }
.tile-card .tc-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 1.7rem; background: var(--tint, var(--surface)); }
.tile-card b { font-size: 1.15rem; }
.tile-card span { color: var(--ink-soft); font-weight: 600; font-size: .95rem; }
.section-h { font-size: 1.25rem; font-weight: 800; margin: 26px 0 12px; }
.tone-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .tone-grid { grid-template-columns: repeat(4, 1fr); } }
.tone-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); }
.tone-cell .zh { font-size: 2rem; line-height: 1.1; }
.tone-cell b { font-size: 1.15rem; color: var(--porcelain-ink); }
.tone-cell small { color: var(--ink-soft); font-weight: 600; text-align: center; line-height: 1.2; }
.contour { width: 38px; height: 30px; color: var(--porcelain); }

.search { width: 100%; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
.search:focus { outline: none; border-color: var(--porcelain); background: var(--card); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter { flex: none; padding: 6px 14px; border-radius: 99px; border: 2px solid var(--line); font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.filter.on { border-color: var(--porcelain); color: var(--porcelain-ink); background: var(--porcelain-tint); }
.word-list { display: flex; flex-direction: column; margin-top: 10px; }
.word-row { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 2px solid var(--line); }
.word-row .zh { font-size: 1.7rem; min-width: 3.4em; line-height: 1.1; }
.word-row .wr-mid { flex: 1; min-width: 0; }
.word-row .wr-mid b { color: var(--porcelain-ink); display: block; }
.word-row .wr-mid span { color: var(--ink-soft); font-weight: 600; }
.word-row.unseen { opacity: .45; }
.strength { display: flex; gap: 3px; align-items: flex-end; }
.strength i { width: 5px; border-radius: 3px; background: var(--line); }
.strength i:nth-child(1) { height: 8px; } .strength i:nth-child(2) { height: 12px; } .strength i:nth-child(3) { height: 16px; } .strength i:nth-child(4) { height: 20px; }
.strength i.on { background: var(--gold); }
.speak-mini { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--porcelain); flex: none; }
.speak-mini svg { width: 22px; height: 22px; }
.speak-mini:active { background: var(--porcelain-tint); }

.league-head { text-align: center; padding: 22px 0 8px; }
.league-badge { width: 84px; height: 84px; margin: 0 auto 8px; border-radius: 24px; display: grid; place-items: center; font-size: 2.6rem; background: var(--lt, var(--jade-tint)); transform: rotate(-4deg); }
.league-head h1 { font-size: 1.6rem; font-weight: 800; }
.league-head p { color: var(--ink-soft); font-weight: 600; }
.lb { margin-top: 14px; display: flex; flex-direction: column; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; }
.lb-row.me { background: var(--porcelain-tint); }
.lb-rank { width: 28px; text-align: center; font-weight: 800; color: var(--ink-soft); }
.lb-row.up .lb-rank { color: var(--jade); }
.lb-row.down .lb-rank { color: var(--wrong); }
.lb-av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; background: var(--surface); flex: none; }
.lb-av svg { width: 38px; }
.lb-name { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-xp { font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.lb-zone { display: flex; align-items: center; gap: 10px; color: var(--jade); font-weight: 800; font-size: .85rem; margin: 6px 0; }
.lb-zone::before, .lb-zone::after { content: ""; flex: 1; height: 2px; background: currentColor; opacity: .4; }
.lb-zone.down { color: var(--wrong); }
.league-note { margin-top: 18px; font-size: .88rem; color: var(--ink-soft); text-align: center; font-weight: 600; }

.profile-top { display: flex; align-items: center; gap: 16px; padding: 22px 0 6px; }
.avatar { width: 92px; height: 92px; border-radius: 50%; background: var(--jade-tint); padding: 8px; flex: none; }
.profile-top h1 { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
.profile-top p { color: var(--ink-soft); font-weight: 600; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 560px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
.stat-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 16px; }
.stat-box .ico { width: 28px; height: 28px; font-size: 1.5rem; line-height: 28px; text-align: center; }
.stat-box b { font-size: 1.25rem; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-box span { color: var(--ink-soft); font-weight: 600; font-size: .85rem; }
.week-chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; padding-top: 22px; position: relative; }
.week-col { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.week-col i { width: 100%; max-width: 34px; height: var(--h); min-height: 4px; border-radius: 8px 8px 4px 4px; background: var(--gold); }
.week-col.zero i { background: var(--line); }
.week-col em { position: absolute; left: -6px; right: -6px; bottom: calc(var(--h) + 3px); text-align: center; font-style: normal; font-size: .72rem; font-weight: 800; color: var(--ink-soft); }
.week-labels { display: flex; gap: 8px; margin-top: 6px; }
.week-labels span { flex: 1; text-align: center; font-size: .8rem; font-weight: 800; color: var(--ink-soft); }
.week-labels span.today { color: var(--ink); text-decoration: underline 2px var(--gold); text-underline-offset: 4px; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--jade); opacity: .7; pointer-events: none; z-index: 1; }
.ach { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 2px solid var(--line); }
.ach:last-child { border-bottom: 0; }
.ach-ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 1.7rem; background: var(--surface); flex: none; filter: grayscale(1); opacity: .6; }
.ach.got .ach-ic { background: var(--gold-tint); filter: none; opacity: 1; }
.ach-mid { flex: 1; min-width: 0; }
.ach-mid b { display: block; }
.ach-mid span { color: var(--ink-soft); font-weight: 600; font-size: .9rem; }
.ach-mid .bar { height: 10px; margin-top: 6px; }
.ach-tag { font-weight: 800; font-size: .85rem; color: var(--teal); white-space: nowrap; }
.setting { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 14px 0; border-bottom: 2px solid var(--line); font-weight: 700; }
.setting:last-child { border-bottom: 0; }
.setting small { display: block; color: var(--ink-soft); font-weight: 600; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 99px; background: var(--line-strong); transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch[aria-checked="true"] { background: var(--jade); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.seg { display: flex; background: var(--surface); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 10px; border-radius: 9px; font-weight: 700; font-size: .9rem; color: var(--ink-soft); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.goal-opts { display: grid; gap: 10px; }
.goal-opt { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 4px; font-weight: 800; font-size: 1.05rem; text-align: left; }
.goal-opt span { color: var(--ink-soft); font-weight: 600; }
.goal-opt.on { border-color: var(--porcelain); background: var(--porcelain-tint); color: var(--porcelain-ink); }
.goal-opt.on span { color: var(--porcelain-ink); }
.backup-box { width: 100%; min-height: 90px; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-family: ui-monospace, Menlo, monospace; font-size: .75rem; word-break: break-all; resize: vertical; }

/* ---------- Onboarding ---------- */
.onboard { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 22px; max-width: 460px; margin: 0 auto; gap: 18px; }
.onboard .panda { width: 180px; }
.onboard h1 { font-size: 2rem; font-weight: 800; line-height: 1.1; }
.onboard p { color: var(--ink-soft); font-weight: 600; font-size: 1.08rem; }
.onboard .actions { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.onboard .goal-opts { width: 100%; }
.hero-chars { display: flex; gap: 8px; justify-content: center; }

/* ---------- Lesson ---------- */
.lesson { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.l-head { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 1000px; margin: 0 auto; padding: 12px 14px 8px 8px; }
.l-prog { position: relative; flex: 1; height: 18px; border-radius: 99px; background: var(--line); }
.l-prog > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--jade); transition: width .45s cubic-bezier(.3,1.4,.5,1), background .3s; min-width: 18px; }
.l-prog > i::after { content: ""; position: absolute; left: 9px; right: 9px; top: 4px; height: 5px; border-radius: 4px; background: rgba(255,255,255,.35); }
.l-prog.hot > i { background: var(--ember); }
.l-combo { position: absolute; left: 0; top: calc(100% + 4px); font-size: .82rem; font-weight: 800; color: var(--ember); white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; }
.l-combo.show { opacity: 1; transform: none; }
.l-timer > i { background: var(--porcelain); transition: width .25s linear; }
.score-chip { position: relative; display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; border-radius: 99px; background: var(--gold-tint); color: var(--gold-ink); font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; flex: none; }
.score-chip .ico { width: 22px; height: 22px; }
.heart-chip { display: flex; align-items: center; gap: 3px; font-weight: 800; color: var(--lantern); font-size: 1.05rem; flex: none; }
.heart-chip .ico { width: 24px; height: 24px; }
.heart-chip.inf { color: var(--ink-soft); }
.xp-float { position: absolute; right: 0; top: 100%; font-weight: 800; color: var(--gold-ink); pointer-events: none; animation: floatUp 1s ease-out forwards; font-size: 1.1rem; white-space: nowrap; }
@keyframes floatUp { from { opacity: 0; transform: translateY(18px) scale(.8); } 25% { opacity: 1; transform: translateY(4px) scale(1.15); } to { opacity: 0; transform: translateY(-14px) scale(1); } }
.l-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.l-inner { max-width: 620px; min-height: 100%; margin: 0 auto; padding: 18px 18px 26px; display: flex; flex-direction: column; gap: 20px; }
.ex-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--plum); font-weight: 800; font-size: .95rem; }
.ex-title { font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
@media (min-width: 760px) { .ex-title { font-size: 1.8rem; } .l-inner { padding-top: 34px; } }
.ex-grow { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.prompt-row { display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* tianzige (田字格) practice grid */
.tzg-row { --cell: min(23vw, 98px); display: flex; gap: 6px; justify-content: center; }
.tzg-row.md { --cell: 64px; }
.tzg-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tzg-py { font-weight: 700; color: var(--ink-soft); font-size: 1.05rem; min-height: 1.3em; }
.tzg-row.md .tzg-py { font-size: .9rem; }
.tzg {
  position: relative; width: var(--cell); height: var(--cell); border: 2px solid var(--lantern); border-radius: 6px;
  background: var(--card); display: grid; place-items: center;
}
.tzg::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, var(--grid) 0 5px, transparent 5px 10px) 50% 50% / 100% 1.5px no-repeat,
    repeating-linear-gradient(180deg, var(--grid) 0 5px, transparent 5px 10px) 50% 50% / 1.5px 100% no-repeat;
}
.tzg .zh { position: relative; font-size: calc(var(--cell) * .66); line-height: 1; color: var(--ink); }
.hide-py .tzg-py { visibility: hidden; }

.speak-btn {
  width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
  background: var(--porcelain); color: #fff; box-shadow: 0 5px 0 var(--porcelain-deep); flex: none;
  transition: transform .07s, box-shadow .07s;
}
.speak-btn:active { transform: translateY(5px); box-shadow: none; }
.speak-btn svg { width: 36px; height: 36px; }
.speak-btn.big { width: 120px; height: 120px; border-radius: 30px; }
.speak-btn.big svg { width: 58px; height: 58px; }
.speak-btn.slow { width: 72px; height: 72px; font-size: 2rem; }
.speak-btn.sm { width: 46px; height: 46px; border-radius: 14px; box-shadow: 0 4px 0 var(--porcelain-deep); }
.speak-btn.sm svg { width: 24px; height: 24px; }
.speaking { animation: bump .5s ease-out; }

.say { display: flex; align-items: flex-end; gap: 10px; }
.say .panda { width: 92px; flex: none; }
.bubble {
  position: relative; flex: 1; padding: 14px 16px; border: 2px solid var(--line); border-radius: 18px; background: var(--card);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 22px; width: 18px; height: 18px; background: var(--card); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.sent { display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 1.6rem; line-height: 1.9; }
.tok { position: relative; border-bottom: 2px dashed var(--line-strong); cursor: pointer; padding: 0 1px; }
.tok rt { font-family: var(--font-ui); font-size: .48em; color: var(--ink-soft); font-weight: 700; }
.hide-py .tok rt { visibility: hidden; }
.tip {
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 3;
  background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 10px; font-family: var(--font-ui);
  font-size: .95rem; font-weight: 700; line-height: 1.25; white-space: nowrap; text-align: center; display: none;
}
.tok.show .tip { display: block; }
.en-prompt { font-size: 1.35rem; font-weight: 700; }

.opts { display: grid; gap: 12px; }
.opts.g2 { grid-template-columns: 1fr 1fr; }
.opt {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 62px; width: 100%;
  padding: 12px 16px; border-radius: 16px; background: var(--card); text-align: left;
  border: 2px solid var(--line); border-bottom-width: 4px; font-size: 1.15rem; font-weight: 700;
  transition: background .12s, border-color .12s;
}
.opt:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; margin-top: 2px; }
.opt:disabled { cursor: default; }
.opt .kbd { display: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); font-size: .85rem; color: var(--ink-faint); place-items: center; flex: none; }
@media (hover: hover) and (pointer: fine) { .opt .kbd { display: grid; } }
.opt .zh { font-size: 1.7rem; line-height: 1.1; }
.opt .py { font-size: .9rem; color: var(--ink-soft); font-weight: 700; display: block; }
.hide-py .opt .py { display: none; }
.opt.sel { border-color: var(--porcelain); background: var(--porcelain-tint); color: var(--porcelain-ink); }
.opt.sel .kbd { border-color: currentColor; color: inherit; }
.opt.right { border-color: var(--jade); background: var(--jade-tint); color: var(--jade-ink); }
.opt.bad { border-color: var(--wrong); background: var(--wrong-tint); color: var(--wrong-ink); animation: shake .4s; }
.opt.dim { opacity: .5; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.opt.pic { flex-direction: column; justify-content: center; text-align: center; gap: 6px; min-height: 160px; padding: 14px 8px; }
.opt.pic .em { font-size: 3.2rem; line-height: 1.1; }
.opt.pic .kbd { position: absolute; top: 8px; left: 8px; }
.opt.tone { flex-direction: column; justify-content: center; gap: 4px; text-align: center; min-height: 104px; }
.opt.tone .pyt { font-size: 1.45rem; font-weight: 800; }
.opt.tone .kbd { position: absolute; top: 8px; left: 8px; }
.opt.tone .contour { color: inherit; opacity: .8; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 12px; }
.match .opt { justify-content: center; text-align: center; min-height: 68px; flex-direction: column; gap: 0; padding: 8px; }
.match .opt.gone { opacity: .35; border-color: var(--line); background: var(--card); color: var(--ink-faint); }

.build { display: flex; flex-direction: column; gap: 22px; }
.ans {
  min-height: 132px; display: flex; flex-wrap: wrap; gap: 10px 8px; align-content: flex-start; padding: 4px 0;
  background: repeating-linear-gradient(to bottom, transparent 0 63px, var(--line) 63px 65px);
}
.bank { display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: center; }
.tile {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 54px; padding: 6px 14px; border-radius: 13px; background: var(--card);
  border: 2px solid var(--line); border-bottom-width: 4px; font-size: 1.15rem; font-weight: 700; line-height: 1.1;
}
.tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; margin-top: 2px; }
.tile .zh { font-size: 1.5rem; }
.tile .py { font-size: .78rem; color: var(--ink-soft); font-weight: 700; }
.hide-py .tile .py { display: none; }
.tile.ghost { background: var(--line); border-color: var(--line); color: transparent; }
.tile.ghost * { visibility: hidden; }
.tile:disabled { cursor: default; }

/* footer + feedback */
.l-foot { border-top: 2px solid var(--line); background: var(--bg); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.l-foot .wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.l-foot.ok { background: var(--jade-tint); border-top-color: transparent; animation: sheetUp .22s ease-out; }
.l-foot.no { background: var(--wrong-tint); border-top-color: transparent; animation: sheetUp .22s ease-out; }
.fb { display: flex; align-items: flex-start; gap: 12px; }
.fb-ic { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; }
.fb-ic svg { width: 26px; height: 26px; }
.ok .fb-ic { color: var(--jade); } .no .fb-ic { color: var(--wrong); }
.fb h3 { font-size: 1.35rem; font-weight: 800; }
.ok .fb h3 { color: var(--jade-ink); } .no .fb h3 { color: var(--wrong-ink); }
.fb p { font-weight: 700; font-size: 1.05rem; }
.ok .fb p { color: var(--jade-ink); } .no .fb p { color: var(--wrong-ink); }
.fb p .zh { font-size: 1.2em; }
.fb small { display: block; font-weight: 600; opacity: .85; }
@media (min-width: 760px) {
  .l-foot { padding-top: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .l-foot .wrap { flex-direction: row; align-items: center; justify-content: space-between; }
  .l-foot .btn { min-width: 160px; }
  .fb { align-items: center; }
  .fb-ic { width: 64px; height: 64px; } .fb-ic svg { width: 34px; height: 34px; }
}
@keyframes sheetUp { from { transform: translateY(40%); opacity: .4; } }

/* result + celebration */
.celebrate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; }
.celebrate .panda { width: 170px; }
.celebrate h1 { font-size: 2rem; font-weight: 800; line-height: 1.1; color: var(--gold-ink); }
.celebrate h1.jade { color: var(--jade); } .celebrate h1.ember { color: var(--ember); } .celebrate h1.plum { color: var(--plum); }
.celebrate > p { color: var(--ink-soft); font-weight: 600; font-size: 1.08rem; max-width: 34ch; }
.stars-row { display: flex; gap: 10px; }
.stars-row svg { width: 48px; height: 48px; opacity: 0; transform: scale(.3); animation: starIn .45s cubic-bezier(.3,1.6,.5,1) forwards; }
.stars-row svg:nth-child(2) { animation-delay: .25s; width: 58px; height: 58px; margin-top: -8px; }
.stars-row svg:nth-child(3) { animation-delay: .5s; }
@keyframes starIn { to { opacity: 1; transform: scale(1); } }
.res-stats { display: flex; gap: 12px; width: 100%; max-width: 440px; }
.res-stat { flex: 1; border-radius: 16px; border: 2px solid var(--c); background: var(--c); overflow: hidden; }
.res-stat > span { display: block; color: var(--ct, #fff); font-weight: 800; font-size: .82rem; padding: 4px 4px 3px; }
.res-stat > b { display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--card); border-radius: 13px; padding: 12px 4px; font-size: 1.35rem; color: var(--ci, var(--c)); font-variant-numeric: tabular-nums; }
.res-stat .ico { width: 22px; height: 22px; }
.big-flame { width: 150px; height: 150px; }
.big-num { font-size: 4.4rem; font-weight: 800; line-height: 1; color: var(--ember); font-variant-numeric: tabular-nums; }

function levelInfo(xp) {
  let lvl = 1, acc = 0, need = 100;
  while (xp >= acc + need) { acc += need; lvl++; need = 100 + (lvl - 1) * 80; }
  return { lvl, into: xp - acc, need, pct: (xp - acc) / need };
}

function regenHearts() {
  if (state.hearts >= MAX_HEARTS) { state.heartsAt = Date.now(); return; }
  const n = Math.floor((Date.now() - state.heartsAt) / HEART_MS);
  if (n > 0) {
    state.hearts = Math.min(MAX_HEARTS, state.hearts + n);
    state.heartsAt += n * HEART_MS;
    if (state.hearts >= MAX_HEARTS) state.heartsAt = Date.now();
    save();
  }
}

function checkStreak() {
  if (!state.lastDay || state.streak === 0) return;
  const gap = dayDiff(state.lastDay, dayKey());
  if (gap <= 1) return;
  const missed = gap - 1;
  if (state.freezes >= missed) {
    state.freezes -= missed;
    state.lastDay = addDays(dayKey(), -1);
    pendingToasts.push({ icon: '🧊', title: 'Streak freeze used', sub: `Your ${state.streak}-day streak is safe` });
  } else {
    pendingToasts.push({ icon: '💤', title: `Your ${state.streak}-day streak ended`, sub: 'Finish a lesson today to start a new one' });
    state.streak = 0;
  }
  save();
}

  const t = dayKey();

    state.streak = (state.lastDay && dayDiff(state.lastDay, t) === 1 && state.streak > 0) ? state.streak + 1 : 1;

}

/* ================= Tone helpers ================= */
const TONE_MARKS = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', 'ü': 'ǖǘǚǜ' };
function sylInfo(s) {
  for (let i = 0; i < s.length; i++) for (const base in TONE_MARKS) {
    const idx = TONE_MARKS[base].indexOf(s[i]);
    if (idx >= 0) return { pos: i, base, tone: idx + 1 };
  }
  return null;
}
const withTone = (s, info, t) => s.slice(0, info.pos) + TONE_MARKS[info.base][t - 1] + s.slice(info.pos + 1);

/* ================= Exercise generation ================= */
function distractors(w, pool, n, keyFns) {
  const seen = keyFns.map(f => new Set([f(w)]));
  const out = [];
  const tryAdd = c => {
    if (out.length >= n || c.h === w.h) return;
    if (keyFns.some((f, i) => seen[i].has(f(c)))) return;
    keyFns.forEach((f, i) => seen[i].add(f(c)));
    out.push(c);
  };
  shuffle(pool).forEach(tryAdd);
  if (out.length < n) shuffle(ALL_WORDS).forEach(tryAdd);
  return out;
}
function choiceEx(type, w, pool) {
  const keys = {
    pic: [x => x.e, x => x.em],
    listen: [x => x.p, x => x.h],
    rev: [x => x.h, x => x.e],
    mcq: [x => x.e, x => x.h]
  }[type];
  const opts = shuffle([w].concat(distractors(w, pool, type === 'pic' ? 3 : 2, keys)));
  return { type, w, opts, ans: opts.indexOf(w) };
}
function toneEx(w) {
  const syl = w.p.split(' ');
  const cand = syl.map((s, i) => ({ i, info: sylInfo(s) })).filter(x => x.info);
  if (!cand.length) return null;
  const pick = cand[rand(cand.length)];
  const opts = [1, 2, 3, 4].map(t => syl.map((s, i) => i === pick.i ? withTone(s, pick.info, t) : s).join(' '));
  return { type: 'tone', w, opts, ans: pick.info.tone - 1 };
}
function matchEx(words) {
  const ws = [], eS = new Set(), hS = new Set();
  for (const w of shuffle(words)) {
    if (ws.length >= 5) break;
    if (eS.has(w.e) || hS.has(w.h)) continue;
    eS.add(w.e); hS.add(w.h); ws.push(w);
  }
  if (ws.length < 3) return null;
  return { type: 'match', pairs: ws, left: shuffle(ws.map((_, i) => i)), right: shuffle(ws.map((_, i) => i)) };
}
const enNorm = t => KEEP_CAPS.has(t) ? t : t.toLowerCase();
const enTokens = s => s.e.replace(/[?.!,]/g, '').split(/\s+/).map(enNorm);
function buildEx(s, dir, ctxSentences, ctxWords) {
  if (dir === 'en') {
    const ans = enTokens(s);
    const have = new Set(ans.map(t => t.toLowerCase()));
    const want = Math.max(2, Math.min(4, 9 - ans.length));
    let pool = shuffle(Array.from(new Set(ctxSentences.flatMap(enTokens)))).filter(t => !have.has(t.toLowerCase()));
    if (pool.length < want) pool = pool.concat(shuffle(ctxWords.map(w => w.e)).filter(e => !/[\s(]/.test(e) && !have.has(e.toLowerCase())));
    const tiles = shuffle(ans.concat(Array.from(new Set(pool)).slice(0, want))).map((t, id) => ({ id, t }));
    return { type: 'buildEn', s, ans, tiles };
  }
  const ans = s.z.slice();
  const have = new Set(ans);
  const want = Math.max(2, Math.min(3, 7 - ans.length));
  const extra = shuffle(ctxWords.map(w => w.h)).filter(h => !have.has(h)).slice(0, want);
  const tiles = shuffle(ans.concat(extra)).map((t, id) => ({ id, t }));
  return { type: dir === 'listen' ? 'listenBuild' : 'buildZh', s, ans, tiles };
}
function remake(ex) {
  const c = Object.assign({}, ex);
  if (ex.opts && ex.type !== 'tone') { c.opts = shuffle(ex.opts); c.ans = c.opts.indexOf(ex.opts[ex.ans]); }
  if (ex.tiles) c.tiles = shuffle(ex.tiles).map((t, id) => ({ id, t: t.t }));
  if (ex.type === 'match') { c.left = shuffle(ex.left); c.right = shuffle(ex.right); }
  return c;
}
function practiceTypes() { return canListen() ? ['mcq', 'rev', 'listen', 'tone'] : ['mcq', 'rev', 'tone']; }
function practiceEx(w, pool, types = practiceTypes()) {
  for (const t of shuffle(types)) {
    const ex = t === 'tone' ? toneEx(w) : choiceEx(t, w, pool);
    if (ex) return ex;
  }
  return choiceEx('mcq', w, pool);
}

function buildNodeLesson(n) {
  const u = UNITS[n.ui];
  const prior = UNITS.slice(0, n.ui).flatMap(x => x.words);
  const newW = n.k === 'lesson' ? u.words.slice(n.from, n.to) : [];
  const unitSoFar = n.k === 'lesson' ? u.words.slice(0, n.to) : u.words;
  const pool = prior.concat(unitSoFar);
  const known = new Set(pool.map(w => w.h));
  const fits = s => s.z.every(t => known.has(t));
  const ctxSent = UNITS.slice(0, n.ui + 1).flatMap(x => x.sentences).filter(fits);
  const unitSent = u.sentences.filter(fits);
  const items = [], rest = [];
  if (n.k === 'lesson') {
    const newSet = new Set(newW.map(w => w.h));
    newW.forEach((w, i) => {
      items.push(choiceEx('pic', w, pool));
      if (i > 0) items.push(practiceEx(newW[i - 1], pool));
    });
    items.push(practiceEx(newW[newW.length - 1], pool));
    const m = matchEx(newW.concat(sample(unitSoFar.filter(w => !newSet.has(w.h)), 2)));
    if (m) rest.push(m);
    const score = s => s.z.filter(t => newSet.has(t)).length;
    shuffle(unitSent).sort((a, b) => score(b) - score(a)).slice(0, 2)
      .forEach((s, i) => rest.push(buildEx(s, i % 2 ? 'zh' : 'en', ctxSent, pool)));
    const older = pool.filter(w => !newSet.has(w.h));
    if (older.length) rest.push(practiceEx(sample(older, 1)[0], pool));
    const ws = shuffle(newW); let k = 0;
    while (items.length + rest.length < 13) rest.push(practiceEx(ws[k++ % ws.length], pool));
    return items.concat(shuffle(rest));
  }
  const hard = n.k === 'trophy';
  const target = hard ? 15 : 12;
  shuffle(unitSent).slice(0, hard ? 6 : 4).forEach((s, i) => {
    const dir = hard && canListen() && i % 3 === 2 ? 'listen' : (i % 2 ? 'zh' : 'en');
    rest.push(buildEx(s, dir, ctxSent, pool));
  });
  const m = matchEx(u.words); if (m) rest.push(m);
  const types = hard ? (canListen() ? ['rev', 'listen', 'tone'] : ['rev', 'tone', 'mcq']) : practiceTypes();
  const ws = shuffle(u.words); let k = 0;
  while (rest.length < target) rest.push(practiceEx(ws[k++ % ws.length], pool, types));
  return shuffle(rest);
}
function seenPool() {
  const seen = ALL_WORDS.filter(w => state.words[w.h] && state.words[w.h].seen > 0);
  return seen.length >= 6 ? seen : UNITS[0].words.concat(seen.filter(w => w.u > 0));
}
function buildPractice(kind) {
  const pool = seenPool();
  const known = new Set(pool.map(w => w.h));
  const sents = UNITS.flatMap(u => u.sentences).filter(s => s.z.every(t => known.has(t)));
  if (kind === 'listen') {
    const items = sample(pool, 9).map(w => choiceEx('listen', w, pool));
    sample(sents, 2).forEach(s => items.push(buildEx(s, 'listen', sents, pool)));
    return shuffle(items);
  }
  if (kind === 'tones') {
    return shuffle(pool).map(toneEx).filter(Boolean).slice(0, 10);
  }
  const weakness = w => { const r = state.words[w.h] || { s: 0, wrong: 0, t: 0 }; return r.s * 2 - r.wrong + (Date.now() - r.t > 864e5 ? -1 : 0) + Math.random(); };
  const weak = pool.slice().sort((a, b) => weakness(a) - weakness(b)).slice(0, 8);
  const items = weak.map(w => practiceEx(w, pool));
  const m = matchEx(weak); if (m) items.push(m);
  sample(sents, 2).forEach((s, i) => items.push(buildEx(s, i ? 'zh' : 'en', sents, pool)));
  return shuffle(items);
}
/* Jump test: covers everything before the target section, weighted toward the section just before it */
const JUMP_LIVES = 3;
function buildJump(si) {
  const start = SECTIONS[si].from;
  const before = UNITS.slice(0, start);
  const last = UNITS.slice(Math.max(0, start - UNITS_PER_SECTION), start);
  const pool = before.flatMap(u => u.words);
  const lastWords = last.flatMap(u => u.words);
  const olderWords = pool.filter(w => w.u < start - UNITS_PER_SECTION);
  const allSent = before.flatMap(u => u.sentences);
  const lastSent = last.flatMap(u => u.sentences);
  const olderSent = allSent.filter(x => !lastSent.includes(x));
  const items = [];
  const sents = sample(lastSent, olderSent.length ? 4 : 5).concat(olderSent.length ? sample(olderSent, 1) : []);
  sents.forEach((x, i) => items.push(buildEx(x, i % 2 ? 'zh' : 'en', allSent, pool)));
  const types = canListen() ? ['rev', 'mcq', 'listen', 'tone'] : ['rev', 'mcq', 'tone'];
  sample(lastWords, olderWords.length ? 7 : 10).concat(sample(olderWords, olderWords.length ? 3 : 0))
    .forEach(w => items.push(practiceEx(w, pool, types)));
  return shuffle(items);
}
function lightningItem() {
  const pool = seenPool();
  const w = pool[rand(pool.length)];
  const t = ['mcq', 'rev', 'mcq', 'tone'][rand(4)];
  return (t === 'tone' && toneEx(w)) || choiceEx(t === 'tone' ? 'rev' : t, w, pool);
}

/* ================= Session engine ================= */
let LS = null;
function startSession(mode, items, node, target) {
  LS = {
    mode, node, target, lives: JUMP_LIVES, queue: items, total: items.length, idx: 0, solved: 0,
    cur: null, sel: null, picked: [], checked: false, matchSel: null, matched: new Set(),
    combo: 0, maxCombo: 0, xp: 0, mistakes: 0, answered: 0, correct: 0, start: Date.now(),
    timerEnd: mode === 'lightning' ? Date.now() + 60000 : 0, timerId: null, celebrations: [], ci: 0
  };
  document.documentElement.classList.add('locked');
  $$('.toast').forEach(t => { if (t._t && !t._t.quiet && !t.classList.contains('out')) pendingToasts.push(t._t); t.remove(); });
  const el = document.createElement('div');
  el.id = 'lesson'; el.className = 'lesson' + (state.settings.pinyin ? '' : ' hide-py');
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Lesson');
  el.innerHTML = `<header class="l-head" id="l-head"></header><main class="l-body"><div class="l-inner" id="l-ex"></div></main><footer class="l-foot" id="l-foot"></footer>`;
  document.body.appendChild(el);
  renderLessonHead();
  if (mode === 'lightning') {
    LS.timerId = setInterval(tickTimer, 250);
  }
  nextItem();
}
const isPractice = () => LS && LS.mode !== 'lesson';
function renderLessonHead() {
  const lightning = LS.mode === 'lightning';
  const pct = lightning ? 100 : Math.max(0, LS.solved / LS.total * 100);
  $('#l-head').innerHTML = `
    <button class="icon-btn" data-act="quit" aria-label="End session">${I.x}</button>
    <div class="l-prog ${lightning ? 'l-timer' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-label="${lightning ? 'Time left' : 'Lesson progress'}">
      <i style="width:${pct}%"></i><span class="l-combo"></span></div>
    <div class="score-chip" id="l-score" aria-live="polite" aria-label="Score">${I.coin}<b>${fmt(LS.xp)}</b>${boostOn() ? '<span class="boost-badge">×2</span>' : ''}</div>
    ${LS.mode === 'jump'
      ? `<div class="heart-chip" id="l-hearts" aria-label="${LS.lives} mistakes left">${I.heart}<b>${LS.lives}</b></div>`
      : LS.mode === 'lesson' && !god()
      ? `<div class="heart-chip" id="l-hearts" aria-label="${state.hearts} hearts">${I.heart}<b>${state.hearts}</b></div>`
      : `<div class="heart-chip inf" aria-label="Unlimited hearts in practice">${I.heart}<b>∞</b></div>`}`;
}
function updateProgress() {
  const bar = $('#l-head .l-prog');
  if (!bar || LS.mode === 'lightning') return;
  const pct = LS.solved / LS.total * 100;
  bar.querySelector('i').style.width = pct + '%';
  bar.setAttribute('aria-valuenow', Math.round(pct));
  bar.classList.toggle('hot', LS.combo >= 3);
  const c = bar.querySelector('.l-combo');
  if (LS.combo >= 3) { c.textContent = `🔥 ${LS.combo} in a row`; c.classList.add('show'); }
  else c.classList.remove('show');
}
function tickTimer() {
  if (!LS || !LS.timerEnd) return;
  const left = Math.max(0, LS.timerEnd - Date.now());
  const bar = $('#l-head .l-prog i');
  if (bar) bar.style.width = (left / 600) + '%';
  if (left <= 10000 && left > 0 && Math.floor(left / 1000) !== LS.lastTick) { LS.lastTick = Math.floor(left / 1000); SFX.play('tick'); }
  if (left <= 0) { clearInterval(LS.timerId); LS.timerId = null; finishSession(); }
}
function setScore(gain) {
  const chip = $('#l-score');
  if (!chip) return;
  chip.querySelector('b').textContent = fmt(LS.xp);
  chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump');
  const f = document.createElement('span');
  f.className = 'xp-float'; f.textContent = '+' + gain;
  chip.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}
function nextItem() {
  if (LS.mode === 'lightning') {
    if (LS.idx >= LS.queue.length) LS.queue.push(lightningItem());
  } else if (LS.idx >= LS.queue.length) return finishSession();
  LS.cur = LS.queue[LS.idx];
  LS.sel = null; LS.picked = []; LS.checked = false; LS.matchSel = null; LS.matched = new Set();
  renderExercise();
  renderFoot('idle');
  const ex = LS.cur;
  if (state.settings.autoplay || ex.type === 'listen' || ex.type === 'listenBuild') {
    if (ex.type === 'listen' || ex.type === 'mcq') setTimeout(() => TTS.speak(ex.w.h), 250);
    else if (ex.type === 'listenBuild' || ex.type === 'buildEn') setTimeout(() => TTS.speak(ex.s.z.join('')), 250);
  }
  const body = $('#lesson .l-body'); if (body) body.scrollTop = 0;
}

const meaningPhrase = e => /^\(.*\)$/.test(e) ? `the ${esc(e.slice(1, -1))}` : `“${esc(e)}”`;
function tianzige(h, p, cls = '') {

function matchTap(side, i) {
  if (LS.matched.has(i)) return;
  const ex = LS.cur;
  if (side === 'l') TTS.speak(ex.pairs[i].h);
  if (!LS.matchSel || LS.matchSel.side === side) {
    LS.matchSel = { side, i };
    SFX.play('select');
    renderExercise();
    return;
  }
  const a = LS.matchSel;
  LS.matchSel = null;
  if (a.i === i) {
    LS.matched.add(i);
    SFX.play('match', LS.matched.size);
    buzz(12);
    creditWord(ex.pairs[i].h, true, true);
    renderExercise();
    $$(`#l-ex [data-i="${i}"]`).forEach(b => { b.classList.remove('gone'); b.classList.add('right'); setTimeout(() => b.classList.add('gone'), 380); });
    if (LS.matched.size === ex.pairs.length) setTimeout(() => resolve(true), 450);
  } else {
    SFX.play('wrong'); buzz([30, 40, 30]);
    LS.mistakesInMatch = (LS.mistakesInMatch || 0) + 1;
    creditWord(ex.pairs[a.side === 'l' ? a.i : i].h, false);
    renderExercise();
    $$(`#l-ex [data-side="${a.side}"][data-i="${a.i}"], #l-ex [data-side="${side}"][data-i="${i}"]`).forEach(b => b.classList.add('bad'));
  }
}
function check() {
  if (LS.checked || !canCheck()) return;
  const ex = LS.cur;
  let ok;
  if (ex.opts) ok = LS.sel === ex.ans;
  else {
    const got = LS.picked.map(id => ex.tiles.find(t => t.id === id).t);
    ok = ex.type === 'buildEn'
      ? got.join(' ').toLowerCase() === ex.ans.join(' ').toLowerCase()
      : got.join('') === ex.ans.join('');
  }
  if (ex.opts) {
    $$('#l-ex .opt').forEach((b, j) => {

function resolve(ok) {
  const ex = LS.cur;

    LS.correct++; LS.solved++; LS.combo++;

    if (state.settings.autoplay && LS.mode !== 'lightning') {
      if (ex.w && ex.type !== 'mcq') setTimeout(() => TTS.speak(ex.w.h), 200);

/* ---------- finishing & celebrations ---------- */
function finishSession() {
  const s = LS;
  if (s.finished) return;
  s.finished = true;
  if (s.timerId) { clearInterval(s.timerId); s.timerId = null; }
  const lvlBefore = levelInfo(state.xp).lvl;
  const progBefore = state.progress;
  const acc = s.answered ? Math.round(s.correct / s.answered * 100) : 100;
  const perfect = s.mistakes === 0 && !s.mistakesInMatch;
  const mult = boostOn() ? 2 : 1;
  let bonus = 0, gems = 0, stars = 0;
  const node = s.node;
  if (s.mode === 'lesson') {
    bonus = (20 + (perfect ? 20 : 0)) * mult;
    stars = perfect ? 3 : acc >= 80 ? 2 : 1;
    gems = 5 + (perfect ? 5 : 0) + (node.k === 'trophy' ? 20 : 0);
    state.lessons++;
    if (perfect) state.perfect++;
    if (node.gi === state.progress) state.progress++;
    state.stars[node.id] = Math.max(state.stars[node.id] || 0, stars);
    if (node.k === 'trophy') state.trophies++;
  } else if (s.mode === 'jump') {
    bonus = 40 * mult;
    gems = 20;
    state.jumps++;
    state.progress = Math.max(state.progress, sectionStartGi(s.target));
    UNITS.slice(0, SECTIONS[s.target].from).forEach(u => u.words.forEach(w => {
      if (!state.words[w.h]) state.words[w.h] = { s: 1, seen: 1, wrong: 0, t: Date.now() };
    }));
  } else if (s.mode === 'lightning') {
    s.newBest = s.xp > state.lightningBest;
    state.lightningBest = Math.max(state.lightningBest, s.xp);
  } else {
    bonus = 10 * mult;
    state.hearts = Math.min(MAX_HEARTS, state.hearts + 1);
  }
  const total = s.xp + bonus;
  state.xp += total;
  state.gems += gems;
  state.correct += s.correct; state.answered += s.answered;
  state.bestCombo = Math.max(state.bestCombo, s.maxCombo);
  const day = recordDay(total);
  const lvlAfter = levelInfo(state.xp).lvl;
  checkAchievements();
  save();
  s.result = { total, bonus, gems, stars, acc, perfect, time: Date.now() - s.start, lvlBefore, lvlAfter };
  s.celebrations = ['result'];
  if (day.streakUp) s.celebrations.push('streak');
  if (day.goalHit) s.celebrations.push('goal');
  if (lvlAfter > lvlBefore) s.celebrations.push('level');
  if (s.mode === 'lesson' && node.k === 'trophy') s.celebrations.push('unit');
  if (s.mode === 'lesson' && node.k === 'trophy' && node.gi === sectionEndGi(UNITS[node.ui].si) && progBefore <= node.gi) s.celebrations.push('section');
  if (state.progress > progBefore) {
    const goTo = sectionOfGi(state.progress);
    s.afterClose = () => { VIEW_SECTION = goTo; LEARN_MODE = 'path'; };
  }
  s.ci = 0;
  s.celebrating = true;
  showCelebration();
}
function countUp(el, to, ms = 900) {
  if (!el) return;
  if (REDUCED) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / ms);
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- confetti ---------- */
function confetti(n = 140) {
  if (REDUCED) return;
  let c = $('#confetti');
  if (!c) { c = document.createElement('canvas'); c.id = 'confetti'; document.body.appendChild(c); }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#14a86d', '#f5b300', '#e5382d', '#2f7fe0', '#9259e0', '#0fa39d', '#ff8a00'];
  const ps = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: cols[rand(cols.length)]
  }));
  const t0 = performance.now();
  const frame = t => {
    const el = t - t0;
    g.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.vy += .42; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - el / 2600);
      g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7))); g.restore();
    });
    if (el < 2600) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(frame);
}

function godSolve() {
  if (!LS || LS.checked || LS.celebrating || !god()) return;
  const ex = LS.cur;
  if (ex.type === 'match') {
    ex.pairs.forEach((w, i) => { LS.matched.add(i); creditWord(w.h, true, true); });
    renderExercise();
    return resolve(true);
  }
  if (ex.opts) {
    if (LS.mode === 'lightning') return selectOpt(ex.ans);
    LS.sel = ex.ans;
    $$('#l-ex .opt').forEach((b, j) => b.classList.toggle('sel', j === ex.ans));
    return check();
  }
  const used = new Set();
  LS.picked = ex.ans.map(t => { const tile = ex.tiles.find(x => x.t === t && !used.has(x.id)); used.add(tile.id); return tile.id; });
  refreshBuild();
  check();
}
function godMiss() {
  if (!LS || LS.checked || LS.celebrating || !god()) return;
  const ex = LS.cur;
  if (ex.type === 'match') return;
  if (ex.opts) {
    const wrong = (ex.ans + 1) % ex.opts.length;
    if (LS.mode === 'lightning') return selectOpt(wrong);
    LS.sel = wrong;
    $$('#l-ex .opt').forEach((b, j) => b.classList.toggle('sel', j === wrong));
    return check();
  }
  const bad = ex.tiles.find(x => x.t !== ex.ans[0]);
  LS.picked = [bad.id];
  refreshBuild();
  check();
}
function godFinish() {
  if (!LS || LS.celebrating || LS.finished || !god()) return;
  if (LS.mode === 'lightning') { LS.timerEnd = Date.now(); return tickTimer(); }
  const remaining = Math.max(0, LS.total - LS.solved);
  LS.solved = LS.total;
  LS.correct += remaining;
  LS.answered += remaining;
  LS.xp += remaining * 10 * (boostOn() ? 2 : 1);
  LS.idx = LS.queue.length;
  finishSession();
}

/* ================= League (offline, simulated rivals) ================= */
function mulberry(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function leagueBoard(wid = weekId(), tier = state.league, at = Date.now()) {
  const rng = mulberry(hashStr(wid + ':' + tier + ':' + state.created));
  const names = BOT_NAMES.slice();
  for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
  const start = new Date(wid + 'T00:00:00').getTime();
  const days = Math.min(7, Math.max(0, (at - start) / 864e5));
  const rows = names.slice(0, 9).map(name => {
    const lazy = rng() < 0.2 ? 0.2 : 1;
    const rate = (35 + rng() * 250) * (1 + tier * 0.45) * lazy;
    const curve = 0.8 + rng() * 0.4;
    return { name, xp: Math.round(rate * days * curve), av: BOT_ANIMALS[Math.floor(rng() * BOT_ANIMALS.length)] };
  });
  rows.push({ name: state.name, xp: weekXP(wid), me: true });
  return rows.sort((a, b) => b.xp - a.xp || (a.me ? -1 : b.me ? 1 : 0));
}
function checkLeague() {
  const wid = weekId();
  if (state.leagueWeek === wid) return;
  if (state.leagueWeek) {
    const prev = state.leagueWeek;
    const board = leagueBoard(prev, state.league, new Date(prev + 'T00:00:00').getTime() + 7 * 864e5);
    const rank = board.findIndex(r => r.me) + 1;
    const wx = weekXP(prev);
    if (wx > 0 && rank <= 3 && state.league < LEAGUES.length - 1) {
      state.league++;
      pendingToasts.push({ icon: LEAGUES[state.league].icon, title: `Promoted to the ${LEAGUES[state.league].name}!`, sub: `You finished #${rank} last week` });
    } else if (rank >= 9 && state.league > 0) {
      state.league--;
      pendingToasts.push({ icon: '📉', title: `Back to the ${LEAGUES[state.league].name}`, sub: 'Earn more XP this week to climb again', quiet: true });
    } else if (wx > 0) {
      pendingToasts.push({ icon: LEAGUES[state.league].icon, title: `You finished #${rank} last week`, sub: 'A new league week has started', quiet: true });
    }
  }
  state.leagueWeek = wid;
  save();
}

function godBannerHTML() {
  return god() ? `<div class="god-banner" role="status"><span>⚡ God mode is on. Every lesson is unlocked and hearts are unlimited.</span><button data-act="god-off">Turn off</button></div>` : '';

function godTool(t) {
  const today = dayKey();
  if (t === 'xp') { state.xp += 500; state.daily[today] = (state.daily[today] || 0) + 500; }
  if (t === 'gems') state.gems += 500;
  if (t === 'hearts') { state.hearts = MAX_HEARTS; state.heartsAt = Date.now(); }
  if (t === 'streak') { state.streak += 1; state.lastDay = today; state.bestStreak = Math.max(state.bestStreak, state.streak); }
  if (t === 'all') state.progress = NODES.length;
  if (t === 'reset') { state.progress = 0; state.stars = {}; VIEW_SECTION = 0; }
  checkAchievements(); save(); refreshHUD(); renderView(); flushToasts();
  SFX.play('coin');
  const msg = { xp: '+500 XP added', gems: '+500 jade added', hearts: 'Hearts refilled', streak: `Streak is now ${state.streak} days`, all: 'All lessons marked done', reset: 'Path reset to the first lesson' }[t];
  toast({ icon: '⚡', title: msg, quiet: true });
}
function startJump(si) {

}

function closePops() { $$('.node-pop').forEach(p => p.remove()); $$('.node-wrap.popped').forEach(w => w.classList.remove('popped')); }
function toggleNodePop(gi) {

  const n = NODES[gi], st = nodeState(n), u = UNITS[n.ui];

  else if (n.k === 'chest') h = st === 'done'

  closePops();
  const amt = 10 + rand(16);
  openModal(`<div class="center"><h2>Treasure chest</h2><div class="chest-wrap" id="chest">${I.chest}</div>
    <div class="gem-burst" id="gb">+${amt} ${I.gem}</div></div>

function chestOpen(btn) {
  if (btn.dataset.done === '1') { closeModal(); renderApp(); scrollToCurrent(); flushToasts(); return; }
  if (btn.dataset.busy === '1') return;
  btn.dataset.busy = '1';
  btn.disabled = true;
  const amt = +btn.dataset.amt, gi = +btn.dataset.n;
  const wrap = $('#chest');
  wrap.classList.add('shake');
  buzz([20, 60, 20, 60]);
  setTimeout(() => {
    wrap.classList.remove('shake'); wrap.classList.add('open');
    $('#gb').classList.add('show');

/* ================= Words ================= */
const stripTones = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '');
function wordRows() {
  const q = WF.q.trim().toLowerCase(), qn = stripTones(q);
  const rows = ALL_WORDS.filter(w => (WF.s < 0 || UNITS[w.u].si === WF.s) && (!q || w.h.includes(q) || stripTones(w.p).includes(qn) || w.e.toLowerCase().includes(q)));
  if (!rows.length) return `<p class="muted" style="padding:22px 0;font-weight:600">No words match “${esc(WF.q)}”. Try pinyin without tone marks, like “ni hao”.</p>`;
  return rows.map(w => {
    const r = state.words[w.h], seen = r && r.seen > 0, s = r ? r.s : 0;
    return `<div class="word-row ${seen ? '' : 'unseen'}"><span class="zh" lang="zh-CN">${esc(w.h)}</span>
      <div class="wr-mid"><b>${esc(w.p)}</b><span>${esc(w.e)}</span></div>
      <div class="strength" role="img" aria-label="${seen ? `Strength ${s} of 4` : 'Not learned yet'}">${[1, 2, 3, 4].map(i => `<i class="${i <= s ? 'on' : ''}"></i>`).join('')}</div>
      <button class="speak-mini" data-act="speak" data-text="${esc(w.h)}" aria-label="Hear ${esc(w.p)}">${I.speaker}</button></div>`;
  }).join('');
}
function wordsHTML() {
  const n = wordsLearned();
  return `<div class="page-head"><h1>Words</h1><p>${n} of ${ALL_WORDS.length} words learned. Bars fill as you get words right.</p>
    <div class="bar" style="margin-top:10px"><i style="width:${n / ALL_WORDS.length * 100}%"></i></div></div>
    <input class="search" type="search" placeholder="Search hanzi, pinyin or English" value="${esc(WF.q)}" data-input="wsearch" aria-label="Search words" autocomplete="off">
    <div class="filters" role="group" aria-label="Filter by section">${['All sections'].concat(SECTIONS.map((x, i) => `Section ${i + 1}`)).map((l, i) => `<button class="filter ${WF.s === i - 1 ? 'on' : ''}" data-act="wfilter" data-s="${i - 1}" aria-pressed="${WF.s === i - 1}">${l}</button>`).join('')}</div>

/* ================= League ================= */
function leagueHTML() {
  const L = LEAGUES[state.league], board = leagueBoard();
  const daysLeft = 7 - ((new Date().getDay() + 6) % 7);
  const canUp = state.league < LEAGUES.length - 1, canDown = state.league > 0;

    rows += `<div class="lb-row ${r.me ? 'me' : ''} ${rank <= 3 && canUp ? 'up' : ''} ${rank >= 9 && canDown ? 'down' : ''}">
