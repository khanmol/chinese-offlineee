        <button class="btn ghost small" data-act="god-tool" data-t="gems">+500 jade</button>
        <button class="btn ghost small" data-act="god-tool" data-t="hearts">Refill hearts</button>
        <button class="btn ghost small" data-act="god-tool" data-t="streak">+1 streak day</button>
        <button class="btn ghost small" data-act="god-tool" data-t="all">Mark all lessons done</button>
        <button class="btn ghost small" style="color:var(--wrong-ink)" data-act="god-tool" data-t="reset">Reset path</button>
      </div></div>` : ''}
    <h2 class="section-h">Your data</h2>
    <div class="card" style="padding-block:2px">
      <div class="setting"><span>Shop<small>Spend jade on hearts, freezes and boosts</small></span><button class="btn ghost small" data-act="shop">Open</button></div>
      <div class="setting"><span>Back up progress<small>Copy a code to move to another device</small></span><button class="btn ghost small" data-act="backup">Back up</button></div>
      <div class="setting"><span>Restore progress<small>Paste a backup code</small></span><button class="btn ghost small" data-act="restore">Restore</button></div>
      <div class="setting"><span>Reset progress<small>Start over from the first lesson</small></span><button class="btn ghost small" style="color:var(--wrong-ink)" data-act="reset">Reset</button></div>
    </div>
    <div class="wide-hide" style="margin-top:18px">${installCardHTML()}</div>
    <p class="muted" style="text-align:center;font-weight:600;font-size:.88rem;margin:24px 0 6px">baobao is free and works offline. Your progress is saved on this device only.</p>`;
}

/* ================= Modals ================= */
function openScore() {
  const li = levelInfo(state.xp);
  const row = (a, b) => `<div class="setting" style="padding:10px 0"><span>${a}</span><b>${b}</b></div>`;
  openModal(`<div class="center"><div class="big-score">${I.coin}${fmt(state.xp)}</div><p class="lead" style="margin:0">Total XP, your lifetime score</p></div>
    <div style="margin:18px 0 6px;display:flex;justify-content:space-between;font-weight:800"><span>Level ${li.lvl}</span><span class="muted">${fmt(li.into)} / ${fmt(li.need)}</span></div>
    <div class="bar"><i style="width:${li.pct * 100}%;background:var(--plum)"></i></div>
    <div style="margin-top:14px">${goalCardHTML()}</div>
    <div class="card" style="margin-top:14px;padding-block:4px">
      ${row('Today', fmt(todayXP()) + ' XP')}${row('This week', fmt(weekXP()) + ' XP')}
    </div>
    <h3 style="margin:18px 0 4px;font-weight:800">How scoring works</h3>
    <div class="card" style="padding-block:4px">
      ${row('Correct answer', '+10')}${row('Combo bonus, 3+ in a row', '+2 to +10')}${row('Lesson complete', '+20')}${row('Perfect lesson', '+20')}${row('XP boost active', '×2 everything')}
    </div>
    <div class="sheet-actions"><button class="btn block" data-act="close-modal">Got it</button></div>`);
}
function openStreak() {
  const ws = weekStart(), today = dayKey();
  const dots = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => {
    const k = addDays(dayKey(ws), i), on = (state.daily[k] || 0) > 0;
    return `<div class="wd ${on ? 'on' : ''} ${k === today ? 'today' : ''}"><i>${on ? I.check : ''}</i><span>${d}</span></div>`;
  }).join('');
  openModal(`<div class="center"><div style="width:96px">${I.flame.replace('class="ico"', 'style="width:96px;height:96px"')}</div>
    <div class="big-num" style="font-size:3.4rem">${state.streak}</div><h2>day streak</h2>
    <p class="lead" style="margin:0">${practicedToday() ? "You've practiced today. See you tomorrow!" : state.streak ? 'Finish a lesson today to keep your streak alive.' : 'Finish a lesson to start a streak.'}</p>
    <div class="week-dots">${dots}</div></div>
    <div class="card" style="margin-top:16px;padding-block:4px">
      <div class="setting" style="padding:10px 0"><span>Longest streak</span><b>${state.bestStreak} day${state.bestStreak === 1 ? '' : 's'}</b></div>
      <div class="setting" style="padding:10px 0"><span>Streak freezes<small>Protect your streak on a missed day</small></span><b>${state.freezes} / 2</b></div>
    </div>
    <div class="sheet-actions"><button class="btn block" data-act="close-modal">Keep going</button><button class="link-btn" data-act="shop">Get a streak freeze</button></div>`);
}
const SHOP = [
  { id: 'hearts', icon: I.heart, name: 'Refill hearts', desc: 'Back to 5 hearts right away', price: 50, ok: () => state.hearts < MAX_HEARTS, why: 'Hearts are full' },
  { id: 'freeze', icon: '🧊', name: 'Streak freeze', desc: 'Covers one missed day. Hold up to 2.', price: 100, ok: () => state.freezes < 2, why: 'You have 2 already' },
  { id: 'boost', icon: '🚀', name: 'XP boost', desc: 'Double XP for 15 minutes', price: 150, ok: () => !boostOn(), why: 'Boost active' }
];
function openShop() {
  openModal(`<h2>Shop</h2><p class="lead">You have <span class="price" style="font-weight:800;color:var(--teal-ink)">${fmt(state.gems)} ${I.gem}</span> jade. Earn more from lessons, chests and achievements.</p>
    ${SHOP.map(it => {
      const can = it.ok(), afford = state.gems >= it.price;
      return `<div class="shop-item"><span class="shop-ic" aria-hidden="true">${it.icon}</span><div class="shop-mid"><b>${it.name}</b><span>${it.desc}</span></div>
        <button class="btn small ${can && afford ? 'blue' : ''}" data-act="buy" data-item="${it.id}" ${can && afford ? '' : 'disabled'} aria-label="Buy ${it.name} for ${it.price} jade">${can ? `<span class="price">${it.price} ${I.gem}</span>` : it.why}</button></div>`;
    }).join('')}
    <div class="sheet-actions"><button class="btn ghost block" data-act="close-modal">Done</button></div>`);
}
function buy(id) {
  const it = SHOP.find(x => x.id === id);
  if (!it || !it.ok() || state.gems < it.price) return;
  state.gems -= it.price;
  if (id === 'hearts') { state.hearts = MAX_HEARTS; state.heartsAt = Date.now(); }
  if (id === 'freeze') state.freezes++;
  if (id === 'boost') state.boostUntil = Date.now() + 15 * 60 * 1000;
  save();
  SFX.play('coin'); buzz(30);
  toast({ icon: typeof it.icon === 'string' && it.icon.length < 4 ? it.icon : '✅', title: `${it.name} purchased`, sub: id === 'boost' ? 'Double XP for the next 15 minutes' : '' });
  refreshHUD();
  openShop();
}
let heartTimer = null;
function openHearts() {
  regenHearts();
  const full = state.hearts >= MAX_HEARTS;
  const fmtT = ms => { const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; return `${m}:${String(s).padStart(2, '0')}`; };
  openModal(`<div class="center"><h2>Hearts</h2><div class="hearts-row" role="img" aria-label="${state.hearts} of 5 hearts">${Array.from({ length: MAX_HEARTS }, (_, i) => i < state.hearts ? I.heart : I.heart.replace('class="ico"', 'class="ico empty"')).join('')}</div>
    <p class="lead" style="margin:4px 0 0">${full ? 'You have full hearts. Each mistake in a lesson costs one.' : `Next heart in <b id="heart-timer">${fmtT(nextHeartIn())}</b>`}</p></div>
    <div class="sheet-actions">
      ${full ? '' : `<button class="btn blue block" data-act="buy" data-item="hearts" ${state.gems >= 50 ? '' : 'disabled'}>Refill for 50 <span class="price">${I.gem}</span></button>
      <button class="btn ghost block" data-act="heart-practice">Practice to earn a heart</button>`}
      <button class="${full ? 'btn block' : 'link-btn'}" data-act="close-modal">${full ? 'Got it' : 'Not now'}</button></div>`,
    { onClose: () => { clearInterval(heartTimer); heartTimer = null; } });
  clearInterval(heartTimer);
  if (!full) heartTimer = setInterval(() => {
    const el = $('#heart-timer');
    if (!el) return clearInterval(heartTimer);
    const before = state.hearts; regenHearts();
    if (state.hearts !== before) { refreshHUD(); openHearts(); return; }
    el.textContent = fmtT(nextHeartIn());
  }, 1000);
}
function openGuide(ui) {
  const u = UNITS[ui];
  openModal(`<h2>Unit ${ui + 1} guidebook</h2><p class="lead">${esc(u.title)} <span class="zh" lang="zh-CN">${u.zh}</span>. Tap a word to hear it.</p>
    <h3 style="font-weight:800;margin-bottom:2px">Key words</h3>
    ${u.words.map(w => `<div class="guide-word"><span class="zh" lang="zh-CN">${esc(w.h)}</span><div><b>${esc(w.p)}</b><span>${esc(w.e)}</span></div><button class="speak-mini" data-act="speak" data-text="${esc(w.h)}" aria-label="Hear ${esc(w.p)}">${I.speaker}</button></div>`).join('')}
    <h3 style="font-weight:800;margin:18px 0 2px">Key phrases</h3>
    ${u.sentences.map(s => `<div class="guide-sent"><div><span class="zh" lang="zh-CN">${esc(s.z.join(''))}</span><b>${esc(s.p)}</b><span>${esc(s.e)}</span></div><button class="speak-mini" data-act="speak" data-text="${esc(s.z.join(''))}" aria-label="Hear phrase">${I.speaker}</button></div>`).join('')}
    <div class="sheet-actions"><button class="btn block" data-act="close-modal">Close</button></div>`);
}
function openGoalModal() {
  openModal(`<h2>Daily goal</h2><p class="lead">How much XP do you want to earn each day?</p>
    <div class="goal-opts">${GOALS.map(g => `<button class="goal-opt ${state.goal === g.xp ? 'on' : ''}" data-act="set-goal" data-xp="${g.xp}" aria-pressed="${state.goal === g.xp}">${g.label}<span>${g.xp} XP, ${g.sub.toLowerCase()}</span></button>`).join('')}</div>
    <div class="sheet-actions"><button class="btn block" data-act="close-modal">Done</button></div>`);
}
function openNameModal() {
  openModal(`<h2>Your name</h2><p class="lead">Shown on your profile and in the league.</p>
    <input class="name-input" id="name-in" maxlength="20" value="${esc(state.name)}" aria-label="Your name" autocomplete="nickname">
    <div class="sheet-actions"><button class="btn block" data-act="save-name">Save name</button><button class="link-btn" data-act="close-modal">Cancel</button></div>`);
}
function encodeBackup() { return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }
function openBackup() {
  openModal(`<h2>Back up progress</h2><p class="lead">Copy this code and keep it somewhere safe. Paste it into “Restore progress” on any device.</p>
    <textarea class="backup-box" id="bk" readonly aria-label="Backup code">${encodeBackup()}</textarea>
    <div class="sheet-actions"><button class="btn blue block" data-act="copy-backup">Copy code</button><button class="link-btn" data-act="close-modal">Done</button></div>`);
}
function openRestore() {
  openModal(`<h2>Restore progress</h2><p class="lead">Paste a backup code. This replaces the progress on this device.</p>
    <textarea class="backup-box" id="rs" aria-label="Backup code" placeholder="Paste your code here"></textarea>
    <p id="rs-err" style="color:var(--wrong-ink);font-weight:700;margin-top:8px" role="alert"></p>
    <div class="sheet-actions"><button class="btn block" data-act="apply-restore">Restore progress</button><button class="link-btn" data-act="close-modal">Cancel</button></div>`);
}
function applyRestore() {
  const code = ($('#rs').value || '').trim();
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (typeof data !== 'object' || typeof data.xp !== 'number' || typeof data.progress !== 'number') throw new Error('shape');
    const base = DEFAULTS();
    state = Object.assign(base, data, { settings: Object.assign(base.settings, data.settings || {}), onboarded: true });
    save();
    closeModal();
    TAB = 'learn'; LEARN_MODE = 'path'; VIEW_SECTION = sectionOfGi(state.progress);
    renderApp();
    toast({ icon: '✅', title: 'Progress restored', sub: `${fmt(state.xp)} XP, level ${levelInfo(state.xp).lvl}` });
  } catch (e) {
    $('#rs-err').textContent = "That code didn't work. Check that you copied the whole thing.";
  }
}
function openReset() {
  openModal(`<div class="center">${panda('sad')}<h2>Reset all progress?</h2><p class="lead">Your XP, streak, jade and lessons will be erased from this device. Back up first if you might want them later.</p></div>
    <div class="sheet-actions"><button class="btn red block" data-act="do-reset">Reset progress</button><button class="link-btn" data-act="close-modal">Keep my progress</button></div>`);
  $('.modal-back .panda').style.width = '110px';
}

/* ================= Onboarding ================= */
function onboardingHTML() {
  if (OB === 0) return `<div class="onboard"><div style="width:180px">${panda('happy', 'wave')}</div>${logoHTML()}
    <h1>Learn Chinese in five-minute bites</h1>
    <p>Free Mandarin lessons that work offline. Earn XP, keep your streak and climb the league.</p>
    <div class="hero-chars zh" lang="zh-CN" aria-hidden="true">${tianzige('你好', 'nǐ hǎo', 'md')}</div>
    <div class="actions"><button class="btn block" data-act="ob-next">Get started</button><button class="btn ghost block" data-act="restore">I have a backup code</button></div></div>`;
  return `<div class="onboard"><div style="width:120px">${panda('think')}</div><h1>Pick a daily goal</h1>
    <p>A lesson is worth about 150 XP. You can change this anytime.</p>
    <div class="goal-opts">${GOALS.map(g => `<button class="goal-opt ${state.goal === g.xp ? 'on' : ''}" data-act="ob-goal" data-xp="${g.xp}" aria-pressed="${state.goal === g.xp}">${g.label}<span>${g.xp} XP a day</span></button>`).join('')}</div>
    <div class="actions"><button class="btn block" data-act="ob-done">Start from the beginning</button><button class="btn ghost block" data-act="ob-know">I already know some Chinese</button></div></div>`;
}

/* ================= Actions ================= */
const ACT = {
  tab: el => setTab(el.dataset.tab),
  node: el => toggleNodePop(+el.dataset.n),
  'start-node': el => startNode(+el.dataset.n),
  chest: el => openChest(+el.dataset.n),
  'chest-open': el => chestOpen(el),
  guide: el => openGuide(+el.dataset.u),
  score: openScore, streak: openStreak, shop: openShop, hearts: openHearts,
  buy: el => buy(el.dataset.item),
  practice: el => startPractice(el.dataset.kind),
  opt: el => selectOpt(+el.dataset.i),
  tile: el => toggleTile(+el.dataset.id, el.dataset.from),
  match: el => matchTap(el.dataset.side, +el.dataset.i),
  speak: el => {
    TTS.speak(el.dataset.text, !!el.dataset.slow);
    el.classList.remove('speaking'); void el.offsetWidth; el.classList.add('speaking');
    if (!TTS.ready && !warnedVoice) { warnedVoice = true; toast({ icon: '🔇', title: 'No Chinese voice found', sub: 'Add a Mandarin voice in your device speech settings' }); }
  },
  hint: el => {
    const on = el.classList.contains('show');
    $$('.tok.show').forEach(t => t.classList.remove('show'));
    if (!on) { el.classList.add('show'); TTS.speak(el.firstChild.textContent); }
  },
  check: () => check(),
  continue: () => doContinue(),
  quit: () => confirmQuit(),
  'end-lesson': () => { closeModal(); closeLesson(); },
  'celebrate-next': () => celebrateNext(),
  'refill-continue': () => {
    if (state.gems < 50) return;
    state.gems -= 50; state.hearts = MAX_HEARTS; state.heartsAt = Date.now(); save();
    closeModal(); renderLessonHead(); updateProgress(); SFX.play('coin'); doContinue();
  },
  'heart-practice': () => { closeModal(); if (LS) closeLesson(); startPractice('review'); },
  'close-modal': () => closeModal(),
  wfilter: el => { WF.s = +el.dataset.s; renderView(); },
  toggle: el => {
    const k = el.dataset.key;
    state.settings[k] = !state.settings[k]; save();
    el.setAttribute('aria-checked', state.settings[k]);
    if (k === 'sound' && state.settings.sound) SFX.play('correct');
    if (k === 'haptics' && state.settings.haptics) buzz(30);
    if (k === 'god') {
      toast(state.settings.god
        ? { icon: '⚡', title: 'God mode on', sub: 'Everything is unlocked and hearts are unlimited', quiet: true }
        : { icon: '🔒', title: 'God mode off', sub: 'Normal rules are back', quiet: true });
      refreshHUD(); renderView();
    }
  },
  'god-off': () => { state.settings.god = false; save(); toast({ icon: '🔒', title: 'God mode off', sub: 'Normal rules are back', quiet: true }); renderApp(); },
  'god-solve': () => godSolve(),
  'god-miss': () => godMiss(),
  'god-finish': () => godFinish(),
  'god-progress': el => {
    state.progress = Math.max(0, Math.min(NODES.length, +el.dataset.n));
    checkAchievements(); save(); closePops(); refreshHUD(); renderView(); flushToasts();
    toast({ icon: '⚡', title: 'Progress updated', sub: state.progress >= NODES.length ? 'Every lesson is done' : `Up next: ${nodeLabel(NODES[state.progress])}, unit ${NODES[state.progress].ui + 1}`, quiet: true });
  },
  'god-tool': el => godTool(el.dataset.t),
  theme: el => { state.settings.theme = el.dataset.t; save(); applyTheme(); renderView(); },
  'goal-modal': openGoalModal,
  'set-goal': el => { state.goal = +el.dataset.xp; save(); openGoalModal(); refreshHUD(); renderView(); },
  'edit-name': openNameModal,
  'save-name': () => { const v = ($('#name-in').value || '').trim().slice(0, 20); if (v) { state.name = v; save(); } closeModal(); renderView(); },
  backup: openBackup,
  'copy-backup': el => {
    const ta = $('#bk');
    const done = () => { el.textContent = 'Copied'; SFX.play('coin'); };
    ta.select();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) { el.textContent = 'Select the code and copy it'; } });
    else { try { document.execCommand('copy'); done(); } catch (e) { el.textContent = 'Select the code and copy it'; } }
  },
  restore: openRestore,
  'apply-restore': applyRestore,
  reset: openReset,
  'do-reset': () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } memoryStore = null; state = DEFAULTS(); OB = 0; TAB = 'learn'; LEARN_MODE = 'path'; VIEW_SECTION = 0; closeModal(); renderApp(); },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { } deferredInstall = null; refreshHUD(); renderView(); },
  'ob-next': () => { OB = 1; SFX.ensure(); SFX.play('tap'); renderApp(); },
  'ob-goal': el => { state.goal = +el.dataset.xp; SFX.play('select'); renderApp(); },
  sections: () => { LEARN_MODE = 'sections'; TAB = 'learn'; renderApp(); window.scrollTo(0, 0); },
  'view-section': el => {
    VIEW_SECTION = +el.dataset.s; LEARN_MODE = 'path'; TAB = 'learn';
    renderApp(); window.scrollTo(0, 0);
    if (VIEW_SECTION === sectionOfGi(state.progress)) scrollToCurrent(false);
  },
  'jump-confirm': el => openJump(+el.dataset.s),
  'jump-start': el => { closeModal(); startJump(+el.dataset.s); },
  'jump-retry': el => { const si = +el.dataset.s; closeLesson(); startJump(si); },
  'ob-know': () => {
    state.onboarded = true; state.created = dayKey(); save();
    TAB = 'learn'; LEARN_MODE = 'sections'; renderApp(); window.scrollTo(0, 0);
  },
  'ob-done': () => {
    state.onboarded = true; state.created = dayKey(); save();
    TAB = 'learn'; renderApp(); window.scrollTo(0, 0);
    setTimeout(() => toggleNodePop(state.progress), 350);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('.node-pop, .node')) closePops();
  if (!e.target.closest('.tok')) $$('.tok.show').forEach(t => t.classList.remove('show'));
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-input="wsearch"]')) { WF.q = e.target.value; const l = $('#wlist'); if (l) l.innerHTML = wordRows(); }
});
document.addEventListener('keydown', e => {
  const modal = $('.modal-back');
  if (modal) { if (e.key === 'Escape' && !modalOpts.lockClose) closeModal(); return; }
  if (!LS) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
    return;
  }
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') { e.preventDefault(); confirmQuit(); return; }
  if (LS.celebrating) { if (e.key === 'Enter') { e.preventDefault(); celebrateNext(); } return; }
  if (e.key === 'Enter') {
    if (e.target.matches('.tok')) { e.preventDefault(); e.target.click(); return; }
    e.preventDefault();
    if (LS.checked) { if (LS.mode !== 'lightning') doContinue(); } else check();
    return;
  }
  if (god() && !LS.checked) {
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); return godSolve(); }
    if (k === 'x') { e.preventDefault(); return godMiss(); }
  }
  if (god() && e.key.toLowerCase() === 'f') { e.preventDefault(); return godFinish(); }
  if (LS.checked) return;
  const ex = LS.cur, n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) {
    if (ex.opts && n <= ex.opts.length) selectOpt(n - 1);
    else if (ex.tiles && ex.tiles[n - 1] && !LS.picked.includes(ex.tiles[n - 1].id)) toggleTile(ex.tiles[n - 1].id, 'bank');
  } else if (e.key === 'Backspace' && ex.tiles && LS.picked.length) {
    e.preventDefault();
    toggleTile(LS.picked[LS.picked.length - 1], 'ans');
  }
});

/* ================= PWA ================= */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  if (!LS && state.onboarded) { const r = $('#rail'); if (r) r.innerHTML = railHTML(); if (TAB === 'profile') renderView(); }
});
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol) || !$('link[rel="manifest"]')) return;
  navigator.serviceWorker.register('sw.js').catch(() => { });
}

/* ================= Boot ================= */
function boot() {
  VIEW_SECTION = sectionOfGi(state.progress);
  TTS.init();
  regenHearts();
  checkStreak();
  checkLeague();
  checkAchievements();
  save();
  renderApp();
  if (state.onboarded) { scrollToCurrent(false); flushToasts(); }
  registerSW();
  setInterval(() => { if (!LS && state.onboarded) { const h = state.hearts; regenHearts(); if (h !== state.hearts) refreshHUD(); } }, 30000);
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || LS || !state.onboarded) return;
    regenHearts(); checkStreak(); checkLeague(); refreshHUD(); flushToasts();
  });
}
boot();

})();
</script>
